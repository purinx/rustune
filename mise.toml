# 開発用のタスク。`mise run <タスク名>`で実行する。一覧は`mise tasks`。
# Rustのツールチェーンは rust-toolchain.toml で固定しているので、ここでは指定しない。

[env]
# rustupの既定のインストール先。シェルのPATHに無くても、タスクから cargo・trunk を使えるようにする。
_.path = ["{{env.HOME}}/.cargo/bin"]

[tasks.gallery]
description = "UIギャラリー（crates/stories）を http://127.0.0.1:8081/gallery で配信する"
dir = "crates/stories"
run = "trunk serve"
