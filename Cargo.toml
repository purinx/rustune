[workspace]
members = ["crates/domain", "crates/contracts", "crates/server", "crates/web", "crates/stories"]
default-members = ["crates/domain", "crates/contracts", "crates/server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
rustune-domain = { path = "crates/domain" }
rustune-contracts = { path = "crates/contracts" }
axum = "0.8.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
leptos = { version = "0.8.22", features = ["csr"] }
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
console_error_panic_hook = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
codegen-units = 1
panic = "abort"
