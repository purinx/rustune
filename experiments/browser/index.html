<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="application-name" content="Rustune"><meta name="theme-color" content="#121212"><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/style.css"><title>ブラウザ検証 — Rustune</title></head>
<body><main><h1>Rustune ブラウザ検証</h1><p>合成AAC音源・末尾moov・Range・OS操作の検証専用ページです。</p>
<p>Manifest / Service Workerは使用しません。音量に注意してください。</p>
<audio id="audio" src="/audio.m4a" preload="metadata"></audio>
<section aria-label="再生操作"><button id="previous">前の曲</button><button id="play">再生</button><button id="pause">一時停止</button><button id="next">次の曲</button><button id="seek">6秒へシーク</button><button id="clear">セッション解除</button></section>
<p id="status" role="status">読み込み中</p><pre id="events" aria-label="検証イベント"></pre>
<a href="https://support.google.com/chrome/answer/9658361" target="_blank" rel="noopener noreferrer">外部リンクの動作を確認</a>
<p>上のリンクは手動検証時だけ開いてください。</p></main><script type="module" src="/app.js"></script></body></html>
